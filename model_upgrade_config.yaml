# 模型升级配置
data:
  data_dir: "D:/25人工智能/project5/data"
  train_label_file: "./labels/train.txt"
  test_label_file: "./labels/test_without_label.txt"
  output_dir: "./experiments"
  processed_dir: "./data/processed"
  train_split: 0.8
  val_split: 0.2
  random_seed: 42
  max_seq_length: 128
  text_model_name: "bert-base-uncased"  # 保持基础模型，专注于其他优化
  image_size: 224
  image_model_name: "resnet50"

model:
  name: "misa"
  hidden_dim: 320  # 增加隐藏层维度
  dropout: 0.4     # 增加dropout防止过拟合
  misa:
    shared_dim: 160  # 增加共享维度
    private_dim: 160 # 增加私有维度
    use_reconstruction: true
    use_adversarial: true  # 启用对抗训练
  classifier_layers:
    - 320  # 增加分类器维度
    - 160
    - 80   # 添加一层

training:
  batch_size: 2  # 减小批次适应更大模型
  num_epochs: 12
  learning_rate: "1.5e-5"  # 降低学习率适应大模型
  weight_decay: 0.02      # 增加正则化
  scheduler: "cosine"
  warmup_ratio: 0.2       # 增加warmup
  min_lr: "1e-7"

  # 类别权重
  class_weights:
    negative: 3.0
    neutral: 2.5
    positive: 1.0

  loss_weights:
    classification: 1.0
    reconstruction: 0.15  # 增加重建损失权重
    similarity: 0.15      # 增加相似性损失权重
    difference: 0.08      # 增加差异损失权重
    focal_loss_gamma: 2.0

  early_stopping:
    enabled: true
    patience: 8
    min_delta: 0.001

  checkpoint:
    save_best_only: true
    save_every_epoch: false
    monitor: "val_f1_macro"
    save_experiment_info: true
    include_timestamp: true

device:
  use_cuda: false
  num_workers: 0
  mixed_precision: true  # 启用混合精度节省显存

logging:
  log_dir: "./outputs/logs"
  use_tensorboard: false
  use_wandb: false
  log_frequency: 10


